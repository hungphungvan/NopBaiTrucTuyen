<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Quản Lý Nộp Bài - Phùng Văn Hùng (THPT Liễn Sơn)</title>
    <style>
        /* Ép Iframe tràn viền 100% màn hình, trông như một app gốc */
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #f8f9fa; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>
    <iframe id="app-frame" allowfullscreen></iframe>

    <script>
        // 1. DÁN LINK GAS CỦA MÀY VÀO ĐÂY (Link đuôi /exec)
        const gasAppUrl = "https://script.google.com/macros/s/AKfycbzFerxVorN2MWnSOnrMdvbYZoBXwI4cJHgMyG3XN-CNJk361uD46tc5XEb5uG19j3imVg/exec";

        // 2. Bắt các tham số từ thanh địa chỉ GitHub (ví dụ: ?e=VL001&s=HS001)
        const currentParams = window.location.search;

        // 3. Đẩy tham số vào Iframe để kích hoạt luồng học sinh
        document.getElementById("app-frame").src = gasAppUrl + currentParams;
    </script>
</body>
</html>
